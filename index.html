<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Registro de Atendimento PNAE - AZUL</title>
                <link rel="stylesheet" href="style.css">
                </head>
                <body>
                    <div class="container">
                            <header>
                                        <h1>Registro de Atendimento PNAE</h1>
                                                    <p>Selecione uma das opções abaixo para salvar o atendimento</p>
                                                            </header>

                                                                    <form id="formAtendimento" onsubmit="return false;">
                                                                                <div class="campo">
                                                                                                <label for="passageiro">Nome do Passageiro:</label>
                                                                                                                <input type="text" id="passageiro" placeholder="Digite o nome do passageiro" required>
                                                                                                                            </div>

                                                                                                                                        <div class="campo">
                                                                                                                                                        <label for="servico">Serviço Solicitado:</label>
                                                                                                                                                                        <select id="servico" required>
                                                                                                                                                                                            <option value="" disabled selected>Selecione o serviço...</option>
                                                                                                                                                                                                                <option value="Cadeira de Rodas (WCHR/WCHS/WCHC)">Cadeira de Rodas (WCHR/WCHS/WCHC)</option>
                                                                                                                                                                                                                                    <option value="Acompanhamento Idoso/Criança">Acompanhamento Idoso/Criança</option>
                                                                                                                                                                                                                                                        <option value="Deficiência Visual">Deficiência Visual</option>
                                                                                                                                                                                                                                                                            <option value="Deficiência Auditiva">Deficiência Auditiva</option>
                                                                                                                                                                                                                                                                                                <option value="Outros Atendimentos Especializados">Outros Atendimentos Especializados</option>
                                                                                                                                                                                                                                                                                                                </select>
                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                        <div class="campo-duplo">
                                                                                                                                                                                                                                                                                                                                                        <div class="campo">
                                                                                                                                                                                                                                                                                                                                                                            <label for="voo">Número do Voo:</label>
                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="voo" placeholder="Ex: AD4050" required>
                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="campo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label for="origem">Origem:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="origem" placeholder="Ex: VCP" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="campo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="destino">Destino:</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="destino" placeholder="Ex: CNF" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="botoes-grupo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="button" id="btnAssumir" class="btn btn-sucesso">Assumir Agora</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="button" id="btnPendente" class="btn btn-alerta">Deixar Pendente</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="link-painel">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <a href="controle.html" target="_blank">Acessar Painel de Controle ➔</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <!-- BIBLIOTECA DO SUPABASE E SCRIPT PRINCIPAL -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <script src="app.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </html>
