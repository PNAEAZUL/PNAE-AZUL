<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Registro de Atendimento - PNAE</title>
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <style>
                            :root {
                                        --azul-azul: #002D62;
                                                    --azul-claro: #E6EEF8;
                                                                --azul-hover: #001f3f;
                                                                            --verde-sucesso: #00875A;
                                                                                        --amarelo-alerta: #FFAB00;
                                                                                                    --cinza-bg: #F4F6F9;
                                                                                                                --cinza-borda: #D0D7DE;
                                                                                                                        }
                                                                                                                                * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
                                                                                                                                        body { background-color: var(--cinza-bg); color: #24292E; padding: 20px; display: flex; justify-content: center; }
                                                                                                                                                .wrapper { width: 100%; max-width: 650px; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 45, 98, 0.08); border-top: 6px solid var(--azul-azul); }
                                                                                                                                                        h2 { color: var(--azul-azul); font-size: 22px; margin-bottom: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
                                                                                                                                                                .form-group { margin-bottom: 15px; }
                                                                                                                                                                        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
                                                                                                                                                                                label { display: block; font-size: 13px; font-weight: 600; color: #444; margin-bottom: 5px; }
                                                                                                                                                                                        input { width: 100%; padding: 12px; border: 1px solid var(--cinza-borda); border-radius: 6px; font-size: 15px; background: #fff; transition: border-color 0.2s; }
                                                                                                                                                                                                input:focus { outline: none; border-color: var(--azul-azul); box-shadow: 0 0 0 3px rgba(0, 45, 98, 0.1); }
                                                                                                                                                                                                        .btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; }
                                                                                                                                                                                                                .btn { padding: 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; color: white; text-align: center; transition: opacity 0.2s; }
                                                                                                                                                                                                                        .btn:hover { opacity: 0.9; }
                                                                                                                                                                                                                                .btn-iniciar { background-color: var(--verde-sucesso); }
                                                                                                                                                                                                                                        .btn-pendente { background-color: var(--amarelo-alerta); color: #111; }
                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                        .section-title { color: var(--azul-azul); font-size: 18px; margin-top: 30px; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid var(--azul-claro); font-weight: 600; }
                                                                                                                                                                                                                                                                
                                                                                                                                                                                                                                                                        .card { background: #fafbfc; border: 1px solid var(--cinza-borda); padding: 15px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid var(--azul-azul); }
                                                                                                                                                                                                                                                                                .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
                                                                                                                                                                                                                                                                                        .voo-tag { font-weight: 700; font-size: 16px; color: var(--azul-azul); }
                                                                                                                                                                                                                                                                                                .badge { padding: 3px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
                                                                                                                                                                                                                                                                                                        .badge-pendente { background: #fff8e1; color: #b7791f; border: 1px solid #f6e05e; }
                                                                                                                                                                                                                                                                                                                .badge-curso { background: #e6fffa; color: #0070f3; border: 1px solid #b2f5ea; }
                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                .card-body { font-size: 14px; color: #555; margin-bottom: 10px; line-height: 1.5; }
                                                                                                                                                                                                                                                                                                                                        .btn-acao { background: var(--azul-azul); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
                                                                                                                                                                                                                                                                                                                                                .btn-acao:hover { background: var(--azul-hover); }
                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                .nav-link { display: block; text-align: center; margin-top: 25px; color: var(--azul-azul); text-decoration: none; font-weight: 600; font-size: 14px; }
                                                                                                                                                                                                                                                                                                                                                                        .nav-link:hover { text-decoration: underline; }
                                                                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                                                                            <body>
                                                                                                                                                                                                                                                                                                                                                                                <div class="wrapper">
                                                                                                                                                                                                                                                                                                                                                                                        <h2>✈️ Registro de Atendimento PNAE</h2>
                                                                                                                                                                                                                                                                                                                                                                                                <form id="form-atendimento">
                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Nome do Tripulante</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="agente" placeholder="Ex: Carlos Silva" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Número do Voo</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="voo" placeholder="Ex: AD5463" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Nome do Cliente</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="cliente" placeholder="Ex: Maria Souza" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Serviço</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="servico" placeholder="Ex: MAAS / Cadeirante" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-row">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label>Origem</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="origem" placeholder="Ex: Check-in" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Destino</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <input type="text" id="destino" placeholder="Ex: Finger 10" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="btn-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="button" class="btn btn-iniciar" onclick="salvarAtendimento('Em Curso')">Iniciar Atendimento</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button type="button" class="btn btn-pendente" onclick="salvarAtendimento('Pendente')">Deixar Pendente</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="section-title">Atendimentos Ativos de Hoje</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div id="lista-atendimentos-patio">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <p style="color: #666; font-size: 14px; font-style: italic;">Carregando atendimentos...</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <a href="controle.html" class="nav-link">Ir para o Painel de Controle e Gestão →</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const SUPABASE_URL = "https://dzfamogbogonwxgdpvbl.supabase.co";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const SUPABASE_ANON_KEY = "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function obterDataLocalCorreta() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Garante a data considerando o fuso horário local do Brasil (America/Sao_Paulo)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const d = new Date();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        async function salvarAtendimento(status) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const agora = new Date().toISOString();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const novo = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                agente: document.getElementById("agente").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                voo: document.getElementById("voo").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                passageiro: document.getElementById("cliente").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                servico: document.getElementById("servico").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                origem: document.getElementById("origem").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                destino: document.getElementById("destino").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status: status,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                criado_em: agora,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                inicio_em: status === 'Em Curso' ? agora : null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!novo.agente || !novo.voo || !novo.passageiro || !novo.servico || !novo.origem || !novo.destino) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Por favor, preencha todos os campos, incluindo Origem e Destino.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { error } = await supabaseClient.from('atendimentos').insert([novo]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(error) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Erro ao salvar: " + error.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("form-atendimento").reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        carregarAtendimentos();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
