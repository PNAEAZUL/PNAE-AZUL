<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>PRIORIDADES AZUL - Agente</title>
        <link rel="stylesheet" href="style.css">
        </head>
        <body class="body-agente">

          <header class="app-header">
              <div class="logo-area">
                    <h1>PRIORIDADES <span>AZUL</span></h1>
                          <span class="sub-title">AZUL | ORBITAL</span>
                              </div>
                                  <div class="agent-badge">
                                        Ativos/Pendentes: <span id="badgeAtivos">0</span>
                                            </div>
                                              </header>

                                                <main class="container">

                                                    <!-- FORMULÁRIO DE ATENDIMENTO -->
                                                        <section class="card-pnae">
                                                              <div class="card-header-title">
                                                                      <h2>+ Registrar Atendimento</h2>
                                                                            </div>

                                                                                  <form id="formAtendimento">
                                                                                          <div class="form-grid">
                                                                                                    
                                                                                                              <div class="form-group">
                                                                                                                          <label for="agenteNome">Agente Responsável:</label>
                                                                                                                                      <input type="text" id="agenteNome" placeholder="Seu nome / RE...">
                                                                                                                                                </div>

                                                                                                                                                          <div class="form-group">
                                                                                                                                                                      <label for="vooNumero">Nº do Voo:*</label>
                                                                                                                                                                                  <input type="text" id="vooNumero" placeholder="Ex: AD4050" required>
                                                                                                                                                                                            </div>

                                                                                                                                                                                                      <div class="form-group full-width">
                                                                                                                                                                                                                  <label for="clienteNome">Nome do Cliente:*</label>
                                                                                                                                                                                                                              <input type="text" id="clienteNome" placeholder="Digite o nome do passageiro..." required>
                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                  <div class="form-group full-width">
                                                                                                                                                                                                                                                              <label for="pnaeTipo">Tipo de Serviço PNAE:*</label>
                                                                                                                                                                                                                                                                          <input type="text" id="pnaeTipo" placeholder="Ex: WCHC, WCHR, MAAS, DAF..." required>
                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                              <div class="form-group">
                                                                                                                                                                                                                                                                                                          <label for="origem">De (Origem):</label>
                                                                                                                                                                                                                                                                                                                      <input type="text" id="origem" placeholder="Ex: Check-in, Gate 04...">
                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                          <div class="form-group">
                                                                                                                                                                                                                                                                                                                                                      <label for="destino">Para (Destino):</label>
                                                                                                                                                                                                                                                                                                                                                                  <input type="text" id="destino" placeholder="Ex: Finger 10, Remota 12L...">
                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                            <div class="action-buttons-grid">
                                                                                                                                                                                                                                                                                                                                                                                                      <button type="submit" id="btnIniciarNormal" class="btn btn-iniciar">► INICIAR ATENDIMENTO DIRETO</button>
                                                                                                                                                                                                                                                                                                                                                                                                                <button type="button" id="btnRegistrarPendente" class="btn btn-pendente">⚠️ DEIXAR PENDENTE (AGUARDANDO AGENTE)</button>
                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                              </form>
                                                                                                                                                                                                                                                                                                                                                                                                                                  </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                      <!-- LISTA DE ATENDIMENTOS EM CURSO E PENDENTES -->
                                                                                                                                                                                                                                                                                                                                                                                                                                          <section class="card-pnae">
                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card-header-title">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h2>Atendimentos no Pátio (Em Curso / Pendentes)</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="listaAtivos" class="lista-ativos-container">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <p class="empty-msg">Nenhum atendimento ativo no momento.</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <!-- OCORRÊNCIAS E OBSERVAÇÕES -->
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <section class="card-pnae card-chat">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card-header-title">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <h2>Ocorrências & Observações do Pátio</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="chat-logs" id="chatLogs">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="msg sistema">Sistema pronto para registro de ocorrências.</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="input-chat-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input type="text" id="chatInput" placeholder="Ex: Aguardando ambolift / Cliente no W.C.">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <button id="btnEnviarChat" class="btn-enviar">Registrar</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </section>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </main>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <script src="app.js"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </html>
