<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Registro de Atendimento - PNAE</title>
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <style>
                            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
                                    body { background-color: #f0f4f8; color: #333; padding: 15px; }
                                            .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,51,102,0.1); border-top: 5px solid #003366; }
                                                    h2 { color: #003366; margin-bottom: 15px; font-size: 22px; }
                                                            h3 { color: #003366; margin-top: 20px; margin-bottom: 10px; font-size: 18px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
                                                                    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
                                                                            .btn-group { display: flex; gap: 10px; margin-top: 5px; }
                                                                                    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; color: white; }
                                                                                            .btn-iniciar { background-color: #16a34a; }
                                                                                                    .btn-pendente { background-color: #ca8a04; }
                                                                                                            .btn-acao { background-color: #003366; padding: 6px 12px; font-size: 12px; border-radius: 4px; margin-top: 8px; }
                                                                                                                    .card { border: 1px solid #e2e8f0; background: #ffffff; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #003366; }
                                                                                                                            .link-painel { display: block; margin-top: 25px; text-align: center; color: #003366; text-decoration: none; font-weight: bold; font-size: 14px; }
                                                                                                                                    .link-painel:hover { text-decoration: underline; }
                                                                                                                                        </style>
                                                                                                                                        </head>
                                                                                                                                        <body>
                                                                                                                                            <div class="container">
                                                                                                                                                    <h2>Registro de Atendimento</h2>
                                                                                                                                                            <form id="form-atendimento">
                                                                                                                                                                        <input type="text" id="agente" placeholder="Nome do Agente" required>
                                                                                                                                                                                    <input type="text" id="voo" placeholder="Número do Voo" required>
                                                                                                                                                                                                <input type="text" id="cliente" placeholder="Nome do Cliente (Passageiro)" required>
                                                                                                                                                                                                            <input type="text" id="servico" placeholder="Serviço (Ex: MAAS)" required>
                                                                                                                                                                                                                        <div class="btn-group">
                                                                                                                                                                                                                                        <button type="button" class="btn-iniciar" onclick="salvarAtendimento('Em Curso')">Iniciar Atendimento</button>
                                                                                                                                                                                                                                                        <button type="button" class="btn-pendente" onclick="salvarAtendimento('Pendente')">Deixar Pendente</button>
                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                    <h3>Atendimentos Ativos de Hoje</h3>
                                                                                                                                                                                                                                                                                            <div id="lista-atendimentos-patio">
                                                                                                                                                                                                                                                                                                        <p style="color: #666; font-size: 14px;">Carregando...</p>
                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                <a href="controle.html" class="link-painel">→ Ir para o Painel de Controle e Gestão</a>
                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                        <script>
                                                                                                                                                                                                                                                                                                                                                const SUPABASE_URL = "https://dzfamogbogonwxgdpvbl.supabase.co";
                                                                                                                                                                                                                                                                                                                                                        const SUPABASE_ANON_KEY = "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO";
                                                                                                                                                                                                                                                                                                                                                                const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                                                                                                                                                                                                                                                                                                        async function salvarAtendimento(status) {
                                                                                                                                                                                                                                                                                                                                                                                    const agora = new Date().toISOString();
                                                                                                                                                                                                                                                                                                                                                                                                const novo = {
                                                                                                                                                                                                                                                                                                                                                                                                                agente: document.getElementById("agente").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                voo: document.getElementById("voo").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                passageiro: document.getElementById("cliente").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                servico: document.getElementById("servico").value.trim(),
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status: status,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                criado_em: agora,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                inicio_em: status === 'Em Curso' ? agora : null
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!novo.agente || !novo.voo || !novo.passageiro || !novo.servico) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Preencha todos os campos obrigatórios!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { error } = await supabaseClient.from('atendimentos').insert([novo]);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(error) alert("Erro: " + error.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        alert("Registrado com sucesso!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("form-atendimento").reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        carregarAtendimentos();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function alterarStatus(id, novoStatus) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const updateData = { status: novoStatus };
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if(novoStatus === 'Em Curso') updateData.inicio_em = new Date().toISOString();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(novoStatus === 'Concluído') updateData.fim_em = new Date().toISOString();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const { error } = await supabaseClient.from('atendimentos').update(updateData).eq('id', id);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(error) alert("Erro ao atualizar: " + error.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            else carregarAtendimentos();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            async function carregarAtendimentos() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const { data } = await supabaseClient.from('atendimentos').select('*').order('id', { ascending: false });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const hoje = new Date().toISOString().split('T')[0];
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const container = document.getElementById("lista-atendimentos-patio");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const filtrados = data.filter(a => a.criado_em && a.criado_em.split('T')[0] === hoje && a.status !== 'Concluído');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if(filtrados.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                container.innerHTML = `<p style="color: #666; font-size: 14px; font-style: italic;">Nenhum atendimento ativo hoje.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        container.innerHTML = filtrados.map(a => `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <strong>Voo: ${a.voo}</strong> | Passageiro: ${a.passageiro}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <span style="font-size: 13px; color: ${a.status === 'Pendente' ? '#ca8a04' : '#16a34a'}; font-weight: bold;">Status: ${a.status}</span><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <small style="color: #555;">Agente: ${a.agente} | Serviço: ${a.servico}</small><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ${a.status === 'Pendente' 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ? `<button class="btn-acao" onclick="alterarStatus(${a.id}, 'Em Curso')">Iniciar Atendimento</button>`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        : `<button class="btn-acao" style="background-color: #16a34a;" onclick="alterarStatus(${a.id}, 'Concluído')">Encerrar Atendimento</button>`
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        carregarAtendimentos();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </html>
