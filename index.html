<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Registro - PNAE</title>
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <style>
                            :root { --azul: #002D62; --verde: #00875A; --amarelo: #FFAB00; --bg: #F4F6F9; }
                                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
                                            body { background: var(--bg); padding: 20px; display: flex; justify-content: center; }
                                                    .box { width: 100%; max-width: 600px; background: #fff; padding: 25px; border-radius: 10px; border-top: 5px solid var(--azul); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
                                                            h2 { color: var(--azul); font-size: 20px; margin-bottom: 15px; }
                                                                    .grupo { margin-bottom: 12px; }
                                                                            .linha { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
                                                                                    label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 4px; }
                                                                                            input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
                                                                                                    .botoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
                                                                                                            button { padding: 12px; border: none; border-radius: 5px; font-weight: bold; color: #fff; font-size: 14px; cursor: pointer; }
                                                                                                                    .btn-iniciar { background: var(--verde); }
                                                                                                                            .btn-pendente { background: var(--amarelo); color: #111; }
                                                                                                                                    .card { background: #fafafa; border: 1px solid #ddd; padding: 12px; margin-top: 10px; border-radius: 6px; border-left: 4px solid var(--azul); }
                                                                                                                                            .card-topo { display: flex; justify-content: space-between; font-weight: bold; color: var(--azul); margin-bottom: 5px; }
                                                                                                                                                    .card-texto { font-size: 13px; color: #555; line-height: 1.4; }
                                                                                                                                                            .btn-acao { background: var(--azul); color: #fff; border: none; padding: 6px 10px; border-radius: 4px; font-size: 11px; margin-top: 8px; cursor: pointer; }
                                                                                                                                                                    .link { display: block; text-align: center; margin-top: 20px; color: var(--azul); text-decoration: none; font-weight: bold; font-size: 13px; }
                                                                                                                                                                        </style>
                                                                                                                                                                        </head>
                                                                                                                                                                        <body>
                                                                                                                                                                            <div class="box">
                                                                                                                                                                                    <h2>✈️ Registro de Atendimento</h2>
                                                                                                                                                                                            <form id="form">
                                                                                                                                                                                                        <div class="grupo">
                                                                                                                                                                                                                        <label>Nome do Tripulante</label>
                                                                                                                                                                                                                                        <input type="text" id="tripulante" placeholder="Ex: Carlos Silva" required>
                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                <div class="grupo">
                                                                                                                                                                                                                                                                                <label>Nome do Agente Orbital (Opcional se pendente)</label>
                                                                                                                                                                                                                                                                                                <input type="text" id="agente_orbital" placeholder="Ex: Roberto Dias">
                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                        <div class="grupo">
                                                                                                                                                                                                                                                                                                                                        <label>Número do Voo</label>
                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="voo" placeholder="Ex: AD2610" required>
                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                <div class="grupo">
                                                                                                                                                                                                                                                                                                                                                                                                <label>Nome do Cliente</label>
                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="cliente" placeholder="Ex: Maria Souza" required>
                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="grupo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                        <label>Serviço</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="servico" placeholder="Ex: MAAS / WCHC" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="linha">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="grupo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <label>Origem</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input type="text" id="origem" placeholder="Ex: Check-in" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="grupo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label>Destino</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <input type="text" id="destino" placeholder="Ex: Finger 10" required>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="botoes">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="button" class="btn-iniciar" onclick="salvar('Em Curso')">Iniciar Atendimento</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button type="button" class="btn-pendente" onclick="salvar('Pendente')">Deixar Pendente</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </form>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h2 style="margin-top: 25px; font-size: 16px;">Atendimentos Ativos</h2>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="lista"><p style="font-size: 13px; color: #666;">Carregando...</p></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <a href="controle.html" class="link">Ir para o Painel de Controle →</a>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const db = supabase.createClient("https://dzfamogbogonwxgdpvbl.supabase.co", "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function salvar(status) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const tripulante = document.getElementById("tripulante").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const agente_orbital = document.getElementById("agente_orbital").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const voo = document.getElementById("voo").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const passageiro = document.getElementById("cliente").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const servico = document.getElementById("servico").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const origem = document.getElementById("origem").value.trim();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const destino = document.getElementById("destino").value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (!tripulante || !voo || !passageiro || !servico || !origem || !destino) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    alert("Preencha todos os campos obrigatórios.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (status === 'Em Curso' && !agente_orbital) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Falta preencher o nome do Agente Orbital!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("agente_orbital").focus();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const agora = new Date().toISOString();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { error } = await db.from('atendimentos').insert([{
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                tripulante, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                agente_orbital: agente_orbital || null, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                voo, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                passageiro, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                servico, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                origem, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                destino, 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                status,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                criado_em: agora,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                inicio_em: status === 'Em Curso' ? agora : null,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                hora_inicio: status === 'Em Curso' ? agora : null // Garante compatibilidade caso a base use essa coluna
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }]);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (error) alert("Erro: " + error.message);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("form").reset();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    carregar();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function alterar(id, statusAtual) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const agora = new Date().toISOString();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (statusAtual === 'Pendente') {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const orbital = prompt("Preencha o nome do Agente Orbital:");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (!orbital || !orbital.trim()) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Falta preencher o nome do Agente Orbital.");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { error } = await db.from('atendimentos').update({ 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    status: 'Em Curso',
