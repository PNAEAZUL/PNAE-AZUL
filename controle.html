<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Painel de Controle - PNAE</title>
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <style>
                            * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
                                    body { background-color: #f0f4f8; color: #333; padding: 15px; }
                                            .container { max-width: 800px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,51,102,0.1); border-top: 5px solid #003366; }
                                                    .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; }
                                                            h2 { color: #003366; font-size: 20px; }
                                                                    h3 { color: #003366; margin-top: 25px; margin-bottom: 10px; font-size: 16px; border-bottom: 2px solid #e2e8f0; padding-bottom: 5px; }
                                                                            .btn-voltar { background: #003366; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 13px; }
                                                                                    .card-ativo { border: 1px solid #e2e8f0; background: #fafafa; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #ca8a04; }
                                                                                            .card-concluido { border: 1px solid #cbd5e1; background: #f0fdf4; padding: 12px; margin-bottom: 10px; border-radius: 6px; border-left: 4px solid #16a34a; }
                                                                                                    .badge { background: #16a34a; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; float: right; font-weight: bold; }
                                                                                                        </style>
                                                                                                        </head>
                                                                                                        <body>
                                                                                                            <div class="container">
                                                                                                                    <div class="header-flex">
                                                                                                                                <h2>Painel de Gestão - PNAE</h2>
                                                                                                                                            <a href="index.html" class="btn-voltar">← Voltar</a>
                                                                                                                                                    </div>
                                                                                                                                                            
                                                                                                                                                                    <h3>Atendimentos Ativos (Tempo Real)</h3>
                                                                                                                                                                            <div id="painel-ativos"><p style="color: #666; font-size: 14px;">Carregando...</p></div>

                                                                                                                                                                                    <h3 style="margin-top: 30px;">Média de Atendimento (Hoje)</h3>
                                                                                                                                                                                            <div id="painel-concluidos"><p style="color: #666; font-size: 14px;">Nenhum atendimento encerrado hoje.</p></div>
                                                                                                                                                                                                </div>

                                                                                                                                                                                                    <script>
                                                                                                                                                                                                            const SUPABASE_URL = "https://dzfamogbogonwxgdpvbl.supabase.co";
                                                                                                                                                                                                                    const SUPABASE_ANON_KEY = "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO";
                                                                                                                                                                                                                            const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                                                                                                                                                                    function calcularTempoMinutos(inicio, fim) {
                                                                                                                                                                                                                                                if (!inicio || !fim) return null;
                                                                                                                                                                                                                                                            const diffMs = new Date(fim) - new Date(inicio);
                                                                                                                                                                                                                                                                        if (diffMs < 0) return 0;
                                                                                                                                                                                                                                                                                    return Math.floor(diffMs / 60000);
                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                    function formatarMinutos(minutos) {
                                                                                                                                                                                                                                                                                                                if (minutos === null) return "Não registrado";
                                                                                                                                                                                                                                                                                                                            if (minutos === 0) return "Menos de 1 min";
                                                                                                                                                                                                                                                                                                                                        const horas = Math.floor(minutos / 60);
                                                                                                                                                                                                                                                                                                                                                    const mins = minutos % 60;
                                                                                                                                                                                                                                                                                                                                                                return horas > 0 ? `${horas}h ${mins}min` : `${mins} min`;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                async function carregarPainel() {
                                                                                                                                                                                                                                                                                                                                                                                            const { data } = await supabaseClient.from('atendimentos').select('*').order('id', { ascending: false });
                                                                                                                                                                                                                                                                                                                                                                                                        const hoje = new Date().toISOString().split('T')[0];
                                                                                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                                                                                                const dadosHoje = data.filter(a => a.criado_em && a.criado_em.split('T')[0] === hoje);
                                                                                                                                                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                                                                                                                                                        const ativos = dadosHoje.filter(a => a.status !== 'Concluído');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const concluidos = dadosHoje.filter(a => a.status === 'Concluído');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("painel-ativos").innerHTML = ativos.length ? ativos.map(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let tempoEspera = calcularTempoMinutos(a.criado_em, a.inicio_em || new Date().toISOString());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card-ativo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <strong>Voo: ${a.voo}</strong> | Passageiro: ${a.passageiro}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    Status: <span style="color: ${a.status === 'Pendente' ? '#ca8a04' : '#16a34a'}; font-weight:bold;">${a.status}</span><br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ⏱️ <strong>Tempo em espera/curso:</strong> ${formatarMinutos(tempoEspera)}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <small style="color: #555;">Agente: ${a.agente} | Serviço: ${a.servico}</small>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }).join('') : `<p style="color: #666; font-size: 14px; font-style: italic;">Nenhum atendimento ativo hoje.</p>`;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("painel-concluidos").innerHTML = concluidos.length ? concluidos.map(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const espera = calcularTempoMinutos(a.criado_em, a.inicio_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const duracao = calcularTempoMinutos(a.inicio_em, a.fim_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="card-concluido">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span class="badge">Concluído</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <strong>Voo: ${a.voo}</strong> | Passageiro: ${a.passageiro}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div style="margin-top: 6px; font-size: 13px;">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ⏳ <strong>Espera (Até iniciar):</strong> ${formatarMinutos(espera)}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    ⚡ <strong>Duração do serviço:</strong> ${formatarMinutos(duracao)}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div style="margin-top: 6px;"><small style="color: #555;">Agente: ${a.agente} | Serviço: ${a.servico}</small></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }).join('') : `<p style="color: #666; font-size: 14px; font-style: italic;">Nenhum atendimento encerrado registrado hoje.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    carregarPainel();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            setInterval(carregarPainel, 10000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
