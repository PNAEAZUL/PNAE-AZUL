<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Painel de Controle e Gestão</title>
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <style>
                            :root { --azul: #002D62; --verde: #00875A; --amarelo: #FFAB00; --bg: #F4F6F9; }
                                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
                                            body { background: var(--bg); padding: 20px; display: flex; justify-content: center; }
                                                    .box { width: 100%; max-width: 700px; background: #fff; padding: 25px; border-radius: 10px; border-top: 5px solid var(--azul); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
                                                            h2 { color: var(--azul); font-size: 20px; margin-bottom: 15px; }
                                                                    
                                                                            /* Cards de Médias no Topo */
                                                                                    .grid-medias { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
                                                                                            .card-media { background: #E6EEF8; padding: 12px; border-radius: 6px; text-align: center; border-left: 4px solid var(--azul); }
                                                                                                    .card-media span { display: block; font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase; margin-bottom: 4px; }
                                                                                                            .card-media strong { font-size: 18px; color: var(--azul); }

                                                                                                                    .titulo { color: var(--azul); font-size: 16px; margin-top: 20px; margin-bottom: 8px; border-bottom: 2px solid #E6EEF8; padding-bottom: 4px; }
                                                                                                                            .card { background: #fafafa; border: 1px solid #ddd; padding: 12px; margin-top: 8px; border-radius: 6px; border-left: 4px solid var(--azul); }
                                                                                                                                    .card-topo { display: flex; justify-content: space-between; font-weight: bold; color: var(--azul); margin-bottom: 5px; }
                                                                                                                                            .card-texto { font-size: 13px; color: #555; line-height: 1.4; }
                                                                                                                                                    .link { display: block; text-align: center; margin-top: 25px; color: var(--azul); text-decoration: none; font-weight: bold; font-size: 13px; }
                                                                                                                                                        </style>
                                                                                                                                                        </head>
                                                                                                                                                        <body>
                                                                                                                                                            <div class="box">
                                                                                                                                                                    <h2>📊 Painel de Controle e Gestão</h2>
                                                                                                                                                                            
                                                                                                                                                                                    <div class="grid-medias">
                                                                                                                                                                                                <div class="card-media">
                                                                                                                                                                                                                <span>Tempo Médio de Espera</span>
                                                                                                                                                                                                                                <strong id="media-espera">-- min</strong>
                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                        <div class="card-media" style="border-left-color: var(--verde);">
                                                                                                                                                                                                                                                                        <span>Tempo Médio de Serviço</span>
                                                                                                                                                                                                                                                                                        <strong id="media-servico">-- min</strong>
                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                    <div class="titulo">Atendimentos Ativos</div>
                                                                                                                                                                                                                                                                                                                            <div id="div-ativos"><p style="font-size: 13px; color: #666;">Carregando...</p></div>

                                                                                                                                                                                                                                                                                                                                    <div class="titulo">Histórico Concluídos</div>
                                                                                                                                                                                                                                                                                                                                            <div id="div-concluidos"><p style="font-size: 13px; color: #666;">Carregando...</p></div>
                                                                                                                                                                                                                                                                                                                                                    
                                                                                                                                                                                                                                                                                                                                                            <a href="index.html" class="link">← Voltar para o Registro</a>
                                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                                    <script>
                                                                                                                                                                                                                                                                                                                                                                            const db = supabase.createClient("https://dzfamogbogonwxgdpvbl.supabase.co", "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO");

                                                                                                                                                                                                                                                                                                                                                                                    function calcularMinutos(inicio, fim) {
                                                                                                                                                                                                                                                                                                                                                                                                if (!inicio || !fim) return null;
                                                                                                                                                                                                                                                                                                                                                                                                            const diff = new Date(fim) - new Date(inicio);
                                                                                                                                                                                                                                                                                                                                                                                                                        return diff > 0 ? Math.floor(diff / 60000) : 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                        function formatar(min) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (min === null || isNaN(min)) return "N/A";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (min === 0) return "< 1 min";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const h = Math.floor(min / 60);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const m = min % 60;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return h > 0 ? `${h}h ${m}m` : `${m} min`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    async function carregarPainel() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const { data } = await db.from('atendimentos').select('*').order('id', { ascending: false });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!data) return;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const ativos = data.filter(a => a.status !== 'Concluído');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const concluidos = data.filter(a => a.status === 'Concluído');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let somaEspera = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            let somaServico = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        let qtdEspera = 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    let qtdServico = 0;

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                concluidos.forEach(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Usando 'criado_em' que é a coluna oficial da sua base
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const tempoCriacao = a.criado_em || a.created_at;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const esp = calcularMinutos(tempoCriacao, a.inicio_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const serv = calcularMinutos(a.inicio_em, a.fim_em);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (esp !== null) { somaEspera += esp; qtdEspera++; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (serv !== null) { somaServico += serv; qtdServico++; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("media-espera").innerText = qtdEspera > 0 ? formatar(Math.round(somaEspera / qtdEspera)) : "0 min";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    document.getElementById("media-servico").innerText = qtdServico > 0 ? formatar(Math.round(somaServico / qtdServico)) : "0 min";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                // Renderiza Ativos
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            document.getElementById("div-ativos").innerHTML = ativos.length === 0 ? 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            `<p style="font-size: 13px; color: #666; font-style: italic;">Nenhum ativo.</p>` :
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            ativos.map(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const tempoCriacao = a.criado_em || a.created_at;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const esperaAtual = calcularMinutos(tempoCriacao, new Date().toISOString());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-topo"><span>Voo: ${a.voo}</span> <span style="color:${a.status==='Pendente'?'var(--amarelo)':'var(--azul)'}">${a.status}</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card-texto">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Passageiro:</strong> ${a.passageiro}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Trajeto:</strong> ${a.origem} → ${a.destino}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ⏱️ <strong>Espera até o momento:</strong> ${formatar(esperaAtual)}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Tripulante:</strong> ${a.tripulante} | <strong>Orbital:</strong> ${a.agente_orbital || 'Não atribuído'}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }).join('');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            // Renderiza Concluídos
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        document.getElementById("div-concluidos").innerHTML = concluidos.length === 0 ? 
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `<p style="font-size: 13px; color: #666; font-style: italic;">Nenhum concluído.</p>` :
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        concluidos.map(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const tempoCriacao = a.criado_em || a.created_at;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const esp = calcularMinutos(tempoCriacao, a.inicio_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const serv = calcularMinutos(a.inicio_em, a.fim_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card" style="border-left-color: var(--verde);">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-topo"><span>Voo: ${a.voo}</span> <span style="color:var(--verde)">Concluído</span></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card-texto">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Passageiro:</strong> ${a.passageiro}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Trajeto:</strong> ${a.origem} → ${a.destino}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        ⏳ <strong>Tempo de Espera:</strong> ${formatar(esp)} | ⚡ <strong>Tempo de Serviço:</strong> ${formatar(serv)}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <strong>Tripulante:</strong> ${a.tripulante} | <strong>Orbital:</strong> ${a.agente_orbital || 'Não atribuído'}
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                carregarPainel();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        setInterval(carregarPainel, 10000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </script>
