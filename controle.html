<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Painel de Controle - PNAE</title>
            <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
            </head>
            <body style="font-family: Arial, sans-serif; background-color: #f4f6f8; padding: 20px;">
                <div style="max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 8px;">
                        <h2>Painel de Gestão - PNAE (Hoje)</h2>
                                <div id="painel-ativos"></div>
                                        <h3 style="margin-top: 30px;">Média de Atendimento (Hoje)</h3>
                                                <div id="painel-concluidos"></div>
                                                    </div>
                                                        <script>
                                                                const SUPABASE_URL = "https://dzfamogbogonwxgdpvbl.supabase.co";
                                                                        const SUPABASE_ANON_KEY = "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO";
                                                                                const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                        async function carregarPainel() {
                                                                                                    const { data } = await supabaseClient.from('atendimentos').select('*').order('id', { ascending: false });
                                                                                                                const hoje = new Date().toISOString().split('T')[0];
                                                                                                                            
                                                                                                                                        // Filtro por dia atual
                                                                                                                                                    const dadosHoje = data.filter(a => a.criado_em && a.criado_em.split('T')[0] === hoje);
                                                                                                                                                                
                                                                                                                                                                            const ativos = dadosHoje.filter(a => a.status !== 'Concluído');
                                                                                                                                                                                        const concluidos = dadosHoje.filter(a => a.status === 'Concluído');

                                                                                                                                                                                                    document.getElementById("painel-ativos").innerHTML = ativos.length ? ativos.map(a => `<div>Voo ${a.voo} - ${a.status}</div>`).join('') : "Nenhum ativo hoje.";
                                                                                                                                                                                                                document.getElementById("painel-concluidos").innerHTML = concluidos.length ? concluidos.map(a => `<div>Voo ${a.voo} - Concluído</div>`).join('') : "Nenhum encerrado hoje.";
                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                carregarPainel();
                                                                                                                                                                                                                                        setInterval(carregarPainel, 10000);
                                                                                                                                                                                                                                            </script>
                                                                                                                                                                                                                                            </body>
                                                                                                                                                                                                                                            </html>
