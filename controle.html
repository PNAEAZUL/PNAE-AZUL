<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Painel de Controle - PNAE</title>
                <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
                    <style>
                            :root {
                                        --azul-azul: #002D62;
                                                    --azul-claro: #E6EEF8;
                                                                --verde-sucesso: #00875A;
                                                                            --amarelo-alerta: #FFAB00;
                                                                                        --cinza-bg: #F4F6F9;
                                                                                                    --cinza-borda: #D0D7DE;
                                                                                                            }
                                                                                                                    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
                                                                                                                            body { background-color: var(--cinza-bg); color: #24292E; padding: 20px; display: flex; justify-content: center; }
                                                                                                                                    .wrapper { width: 100%; max-width: 850px; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 45, 98, 0.08); border-top: 6px solid var(--azul-azul); }
                                                                                                                                            .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--azul-claro); padding-bottom: 12px; }
                                                                                                                                                    h2 { color: var(--azul-azul); font-size: 22px; font-weight: 700; }
                                                                                                                                                            .btn-voltar { background: var(--azul-azul); color: white; padding: 8px 15px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 13px; transition: opacity 0.2s; }
                                                                                                                                                                    .btn-voltar:hover { opacity: 0.9; }
                                                                                                                                                                            
                                                                                                                                                                                    .section-title { color: var(--azul-azul); font-size: 18px; margin-top: 25px; margin-bottom: 12px; font-weight: 600; }
                                                                                                                                                                                            
                                                                                                                                                                                                    .card-ativo { background: #fffbf0; border: 1px solid #f6e05e; padding: 15px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid var(--amarelo-alerta); }
                                                                                                                                                                                                            .card-concluido { background: #f0fdf4; border: 1px solid #bbf7d0; padding: 15px; margin-bottom: 12px; border-radius: 8px; border-left: 4px solid var(--verde-sucesso); }
                                                                                                                                                                                                                    
                                                                                                                                                                                                                            .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
                                                                                                                                                                                                                                    .voo-tag { font-weight: 700; font-size: 16px; color: var(--azul-azul); }
                                                                                                                                                                                                                                            .badge-concluido { background: var(--verde-sucesso); color: white; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
                                                                                                                                                                                                                                                    .info-detalhe { font-size: 14px; color: #444; margin-top: 4px; line-height: 1.4; }
                                                                                                                                                                                                                                                        </style>
                                                                                                                                                                                                                                                        </head>
                                                                                                                                                                                                                                                        <body>
                                                                                                                                                                                                                                                            <div class="wrapper">
                                                                                                                                                                                                                                                                    <div class="header-flex">
                                                                                                                                                                                                                                                                                <h2>📊 Painel de Gestão - PNAE</h2>
                                                                                                                                                                                                                                                                                            <a href="index.html" class="btn-voltar">← Voltar ao Registro</a>
                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                            
                                                                                                                                                                                                                                                                                                                    <div class="section-title">Atendimentos Ativos (Tempo Real)</div>
                                                                                                                                                                                                                                                                                                                            <div id="painel-ativos">
                                                                                                                                                                                                                                                                                                                                        <p style="color: #666; font-size: 14px; font-style: italic;">Carregando painel...</p>
                                                                                                                                                                                                                                                                                                                                                </div>

                                                                                                                                                                                                                                                                                                                                                        <div class="section-title">Média de Atendimento (Histórico de Hoje)</div>
                                                                                                                                                                                                                                                                                                                                                                <div id="painel-concluidos">
                                                                                                                                                                                                                                                                                                                                                                            <p style="color: #666; font-size: 14px; font-style: italic;">Nenhum atendimento encerrado registrado hoje.</p>
                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                            <script>
                                                                                                                                                                                                                                                                                                                                                                                                    const SUPABASE_URL = "https://dzfamogbogonwxgdpvbl.supabase.co";
                                                                                                                                                                                                                                                                                                                                                                                                            const SUPABASE_ANON_KEY = "sb_publishable_50Zeo1eoWIT7SJxvfA2W7A_N4Ls46kO";
                                                                                                                                                                                                                                                                                                                                                                                                                    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

                                                                                                                                                                                                                                                                                                                                                                                                                            function obterDataLocalCorreta() {
                                                                                                                                                                                                                                                                                                                                                                                                                                        const d = new Date();
                                                                                                                                                                                                                                                                                                                                                                                                                                                    return d.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function calcularTempoMinutos(inicio, fim) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (!inicio || !fim) return null;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const diffMs = new Date(fim) - new Date(inicio);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if (diffMs < 0) return 0;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return Math.floor(diffMs / 60000);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function formatarMinutos(minutos) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (minutos === null) return "Não registrado";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (minutos === 0) return "Menos de 1 min";
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const horas = Math.floor(minutos / 60);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const mins = minutos % 60;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                return horas > 0 ? `${horas}h ${mins}min` : `${mins} min`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                async function carregarPainel() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const { data, error } = await supabaseClient.from('atendimentos').select('*').order('id', { ascending: false });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (error || !data) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    console.error("Erro ao carregar painel:", error);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const hojeStr = obterDataLocalCorreta();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const dadosHoje = data.filter(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        if(!a.criado_em) return false;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const dataCriacaoObj = new Date(a.criado_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const dataCriacaoStr = dataCriacaoObj.toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' });
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return dataCriacaoStr === hojeStr;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    });

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const ativos = dadosHoje.filter(a => a.status !== 'Concluído');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            const concluidos = dadosHoje.filter(a => a.status === 'Concluído');

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const containerAtivos = document.getElementById("painel-ativos");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const containerConcluidos = document.getElementById("painel-concluidos");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (ativos.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                containerAtivos.innerHTML = `<p style="color: #666; font-size: 14px; font-style: italic;">Nenhum atendimento ativo no momento.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            containerAtivos.innerHTML = ativos.map(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let tempoEspera = calcularTempoMinutos(a.criado_em, a.inicio_em || new Date().toISOString());
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-ativo">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="card-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span class="voo-tag">Voo: ${a.voo}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <span style="font-weight: bold; color: ${a.status === 'Pendente' ? '#b7791f' : '#0070f3'};">${a.status}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="info-detalhe">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <strong>Passageiro:</strong> ${a.passageiro || 'Não informado'}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                📍 <strong>Trajeto:</strong> ${a.origem || 'N/A'} → ${a.destino || 'N/A'}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ⏱️ <strong>Tempo decorrido:</strong> ${formatarMinutos(tempoEspera)}<br>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <small style="color: #666;">Agente: ${a.agente} | Serviço: ${a.servico}</small>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        `;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }).join('');
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                if (concluidos.length === 0) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                containerConcluidos.innerHTML = `<p style="color: #666; font-size: 14px; font-style: italic;">Nenhum atendimento encerrado registrado hoje.</p>`;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            } else {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            containerConcluidos.innerHTML = concluidos.map(a => {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const espera = calcularTempoMinutos(a.criado_em, a.inicio_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    const duracao = calcularTempoMinutos(a.inicio_em, a.fim_em);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        return `
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="card-concluido">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="card-header">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span class="voo-tag">Voo: ${a.voo}</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <span class="badge-concluido">Concluído</span>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="info-detalhe">
